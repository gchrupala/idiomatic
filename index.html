<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mowa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6e6e73; --line: #dedbd3; --card: #ffffff;
    --accent: #0a58ca; --accent-fg: #fff; --ok: #1a7f37; --bad: #c62828; --warn: #b26a00;
    --sky: #cfe8f7; --building: #9fb3c8; --window: #f6e7a8; --street: #8d8d8d;
    --wall: #f3e6cf; --floor: #c7a97c; --frame: #7a5b3a; --wood: #9b6b3d; --door: #b5834f; --doorway: #3b2d22;
    --bubble: #fff; --bubble-line: #999;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --fg: #f2f2f2; --muted: #a0a0a5; --line: #343434; --card: #1d1d1d;
      --accent: #6ea8fe; --accent-fg: #0b1a33; --ok: #4ac26b; --bad: #ff6b6b; --warn: #f0b04a;
      --sky: #2d4660; --building: #4b5d70; --window: #c9b46a; --street: #3a3a3a;
      --wall: #4a4034; --floor: #6b5539; --frame: #2c2117; --wood: #6a4a2c; --door: #7a5634; --doorway: #120d09;
      --bubble: #f2f2f2; --bubble-line: #777;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { max-width: 620px; margin: 0 auto; padding: 8px 16px 48px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .92rem; }
  .top { display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .top h1 { font-size: 1.25rem; margin: 0; }
  .back { font-size: 2rem; text-decoration: none; line-height: 1; padding: 0 8px 4px 0; }
  .title { font-size: 1.6rem; margin: 4px 0 18px; }
  button, .button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: .9rem; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .center { justify-content: center; }
  .fa { display: inline-flex; flex-direction: column; }
  .fa .script, .script { font-family: Vazirmatn, Tahoma, sans-serif; color: var(--muted); font-size: .9em; }
  .langs, .steps { display: grid; gap: 10px; margin: 16px 0; }
  .lang, .step { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
  .flag, .icon { font-size: 2rem; }
  .settings { display: grid; gap: 10px; margin-top: 28px; font-size: .95rem; }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; }

  /* listen */
  .stage { width: 100%; aspect-ratio: 400 / 240; border-radius: 14px; background: var(--wall); display: block; }
  .actor, .prop { transition: transform 1s ease-in-out, opacity .5s; }
  .door-panel { transition: transform .8s ease; transform-origin: 344px 0; transform-box: view-box; }
  .door-panel.open { transform: scaleX(.15); }
  .talking .head { animation: talk .35s ease-in-out infinite alternate; }
  @keyframes talk { to { transform: translateY(-1.5px); } }
  .emoji { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .body, .arm { transform-box: fill-box; }
  .subtitle { min-height: 3.2em; margin: 10px 0 0; font-size: 1.1rem; text-align: center; }
  .subtitle .who { display: block; font-size: .8rem; color: var(--muted); }
  .dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; background: var(--line); border: 0; }
  .dots button.done { background: var(--muted); }
  .dots button.now { background: var(--accent); }
  .controls { display: flex; justify-content: center; gap: 18px; margin: 8px 0; }
  .round { width: 56px; height: 56px; border-radius: 50%; padding: 0; font-size: 1.3rem; }
  .round.small { width: 40px; height: 40px; font-size: 1rem; margin-inline-end: 8px; }
  .end { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-top: 12px; background: var(--card); }

  /* read */
  .reader { display: grid; gap: 4px; margin-top: 8px; }
  .sent { position: relative; padding: 10px 44px 10px 12px; border-radius: 12px; cursor: pointer; }
  .sent.now { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .sent .who { font-size: .8rem; color: var(--muted); }
  .sent .text { font-size: 1.15rem; }
  .sent .text.fa { display: block; }
  .sent .text .script { display: block; text-align: right; font-size: 1rem; }
  .sent .tr { color: var(--muted); font-size: .92rem; margin-top: 4px; }
  .trbtn { position: absolute; right: 6px; top: 8px; font-size: .7rem; padding: 4px 6px; border-radius: 8px; color: var(--muted); }
  .w { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-radius: 0; border-bottom: 2px dotted var(--accent); cursor: help; }
  .pop { position: absolute; z-index: 5; width: 270px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); display: grid; gap: 8px; }
  .pop .head { font-weight: 600; font-size: 1.1rem; }
  .pop .tl { font-size: 1.05rem; }
  .pop .l1 { color: var(--muted); }

  /* practice */
  .grid { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0 14px; }
  .sq { width: 14px; height: 14px; border-radius: 3px; background: var(--line); }
  .sq.practising { background: var(--warn); }
  .sq.learned { background: color-mix(in srgb, var(--ok) 55%, var(--bg)); }
  .sq.mastered { background: var(--ok); }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .prompt { display: flex; justify-content: center; align-items: center; min-height: 96px; text-align: center; }
  .pic { font-size: 4.5rem; line-height: 1.1; }
  .pic.small { font-size: 2.4rem; }
  .q { font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .answers form { grid-column: 1 / -1; }
  .opt { min-height: 64px; font-size: 1.1rem; }
  .opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--card)); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--card)); }
  .typed { font: inherit; font-size: 1.2rem; flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: inherit; }
  .mic { justify-self: center; }
  .mic.on { border-color: var(--bad); color: var(--bad); }
  .feedback { min-height: 1.4em; margin: 0; text-align: center; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .big { font-size: 1.4rem; text-align: center; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="srs.js"></script>
<script src="speech.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
