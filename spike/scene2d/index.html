<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mowa 2D scene</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6e6e73; --line: #dedbd3; --card: #fff; --accent: #0a58ca; --accent-fg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #f2f2f2; --muted: #a0a0a5; --line: #343434; --card: #1d1d1d; --accent: #6ea8fe; --accent-fg: #0b1a33; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 16px 40px; }
  h1 { font-size: 1.2rem; margin: 6px 0 10px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #bfe6ff; }
  svg { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .3); color: #fff; text-align: center; }
  .overlay button { font-size: 1.1rem; }
  .letter { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); width: min(78%, 360px); padding: 18px 20px; background: #fffaf0; color: #3a2a1a; border-radius: 6px; box-shadow: 0 8px 30px rgb(0 0 0 / .35); font: italic 1.15rem/1.4 Georgia, serif; text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .letter.on { opacity: 1; }
  .subtitle { min-height: 3.4em; margin: 10px 0 0; font-size: 1.15rem; text-align: center; }
  .subtitle .who { display: block; font-size: .8rem; color: var(--muted); }
  .controls { display: flex; justify-content: center; gap: 14px; margin: 8px 0; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .round { width: 52px; height: 52px; border-radius: 50%; padding: 0; font-size: 1.2rem; }
  .muted { color: var(--muted); font-size: .88rem; }
</style>
</head>
<body>
<main>
  <h1>Una carta sin nombre</h1>
  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="letter" id="letter">El sábado, a las diez,<br>en la Plaza Mayor.</div>
    <div class="overlay" id="overlay"><button class="primary" id="start">▶ Empezar</button></div>
  </div>
  <p class="subtitle" id="subtitle"></p>
  <div class="controls">
    <button class="round" id="prev" aria-label="Anterior">⏮</button>
    <button class="round" id="play" aria-label="Pausa">⏸</button>
    <button class="round" id="next" aria-label="Siguiente">⏭</button>
  </div>
  <p class="muted">Prueba de estilo: capítulo 1 entero, dibujado y animado en código (SVG), sin imágenes ni servicios externos.</p>
</main>
<script type="module" src="scene2d.js"></script>
</body>
</html>
